services:
  prepare-data:
    build:
      context: ./src/pipeline
    container_name: cinematch-prepare-data
    restart: "no"
    volumes:
      - ./data:/app/data
    command: python ingest.py

  db:
    image: postgres:16
    container_name: cinematch-db
    command: >
      postgres
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c shared_buffers=512MB
      -c maintenance_work_mem=512MB
    environment:
      POSTGRES_USER: cinematch_user
      POSTGRES_PASSWORD: PASSWORD
      POSTGRES_DB: cinematch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/cinematch_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  seed:
    build:
      context: ./src/backend
    container_name: cinematch-seed
    restart: "no"
    env_file:
      - ./src/backend/.env
    depends_on:
      db:
        condition: service_started
      prepare-data:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    command: >
      sh -c "sleep 8 &&
             python scripts/load_data.py --data-dir /app/data/processed"

  ml:
    build:
      context: ./src/ml
    container_name: cinematch-ml
    env_file:
      - ./src/ml/.env
    depends_on:
      prepare-data:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  backend:
    build:
      context: ./src/backend
    container_name: cinematch-backend
    env_file:
      - ./src/backend/.env
    depends_on:
      seed:
        condition: service_completed_successfully
      ml:
        condition: service_started
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  front:
    build:
      context: ./src/front
    container_name: cinematch-front
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8501:8501"

volumes:
  postgres_data: